<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KOsT — a running tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }

  [data-theme="light"] { --bg:#EFEBE1; --surface:#FCFAF4; --ink:#211E18; --ink-soft:#857E6E; --line:#DCD5C2; --accent:#33513B; --danger:#A6402F; --shadow:0 24px 60px -30px rgba(33,30,24,.35); }
  [data-theme="dark"]  { --bg:#131210; --surface:#1D1B16; --ink:#EEE9DC; --ink-soft:#8C8576; --line:#38352A; --accent:#8FBB96; --danger:#D48D78; --shadow:0 24px 60px -24px rgba(0,0,0,.6); }

  html, body { height: 100%; }
  body {
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 48px 16px; background: var(--bg); transition: background .35s ease;
    font-family: 'IBM Plex Sans', Arial, sans-serif;
  }
  .wrap { width: 100%; max-width: 640px; }
  .num { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); box-shadow: var(--shadow); animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .top-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  #themeBtn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .2s ease;
  }
  #themeBtn:hover { transform: rotate(-14deg); }
  #themeBtn svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .header { padding: 36px 40px 20px; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px dashed var(--line); }
  .header .icon { color: var(--accent); margin-bottom: 4px; }
  .header .icon svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; font-size: 32px; color: var(--ink); margin: 0; }
  .tagline { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); }
  .date { font-size: 12px; color: var(--ink-soft); }

  .add-row { display: flex; align-items: center; gap: 12px; padding: 20px 40px; border-bottom: 1px dashed var(--line); }
  .add-row input { background: transparent; border: none; outline: none; color: var(--ink); font-family: 'IBM Plex Sans', Arial, sans-serif; font-size: 15px; }
  .add-row input::placeholder { color: var(--ink-soft); }
  #itemName { flex: 1 1 auto; min-width: 0; }
  #itemPrice { width: 100px; text-align: right; }
  #addBtn {
    width: 32px; height: 32px; min-width: 32px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--surface); display: flex; align-items: center;
    justify-content: center; cursor: pointer; transition: transform .15s ease;
  }
  #addBtn:active { transform: scale(.94); }
  #addBtn svg { width: 16px; height: 16px; stroke: var(--surface); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .list { max-height: 46vh; overflow-y: auto; }
  .list.has-items { padding: 20px 40px 8px; }
  .empty { text-align: center; padding: 40px 32px; color: var(--ink-soft); }
  .empty p:first-child { margin: 0; font-size: 14px; color: var(--ink); }
  .empty p:last-child { margin: 4px 0 0; font-size: 13px; }

  .item-row { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; animation: itemIn .32s ease-out both; }
  @keyframes itemIn { from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  .item-row .name { font-size: 14px; color: var(--ink); }
  .item-row .leader { flex: 1 1 auto; border-bottom: 1px dotted var(--line); transform: translateY(-4px); }
  .item-row .price { font-size: 14px; color: var(--ink); }
  .item-row .del {
    opacity: 0; border: none; background: none; cursor: pointer; color: var(--danger);
    display: flex; padding: 2px; transition: opacity .15s ease;
  }
  .item-row:hover .del, .item-row:focus-within .del { opacity: 1; }
  .item-row .del svg { width: 13px; height: 13px; stroke: var(--danger); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .total-row { margin: 8px 40px 0; padding-top: 14px; border-top: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
  .total-row .label { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 17px; color: var(--ink); }
  .total-row .amount { font-size: 22px; font-weight: 600; color: var(--accent); }

  .footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px 32px; flex-wrap: wrap; gap: 10px; }
  .count { font-size: 12px; color: var(--ink-soft); }
  .actions { display: flex; align-items: center; gap: 16px; }
  #clearBtn { border: none; background: none; cursor: pointer; font-size: 12px; color: var(--ink-soft); text-decoration: underline; padding: 0; }
  .export-btn {
    display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 7px 12px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer; transition: border-color .2s ease, color .2s ease;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }
  .export-btn:disabled { opacity: .45; cursor: not-allowed; }
  .export-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  @media print {
    body { background: #fff !important; padding: 0 !important; }
    .noprint { display: none !important; }
    .list { max-height: none !important; overflow: visible !important; }
    .card { box-shadow: none !important; animation: none !important; }
  }
</style>
</head>
<body data-theme="light">
<div class="wrap">
  <div class="top-row noprint">
    <button id="themeBtn" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="card">
    <div class="header">
      <div>
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>
        </div>
        <h1>KOsT</h1>
        <p class="tagline">a running tally of what you spend</p>
      </div>
      <span class="date num" id="todayLabel"></span>
    </div>

    <div class="add-row noprint">
      <input id="itemName" type="text" placeholder="Item" />
      <input id="itemPrice" class="num" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" />
      <button id="addBtn" aria-label="Add item">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="list" id="list"></div>

    <div class="total-row">
      <span class="label">Total</span>
      <span class="amount num" id="totalAmount">₹0.00</span>
    </div>

    <div class="footer">
      <span class="count" id="itemCount">0 items</span>
      <div class="actions noprint">
        <button id="clearBtn" style="display:none;">Clear all</button>
        <button class="export-btn" id="csvBtn" disabled>
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          CSV
        </button>
        <button class="export-btn" id="pdfBtn" disabled>
          <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          PDF
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var items = [];
  var nextId = 1;
  var theme = "light";

  var listEl = document.getElementById("list");
  var totalEl = document.getElementById("totalAmount");
  var countEl = document.getElementById("itemCount");
  var clearBtn = document.getElementById("clearBtn");
  var csvBtn = document.getElementById("csvBtn");
  var pdfBtn = document.getElementById("pdfBtn");
  var nameInput = document.getElementById("itemName");
  var priceInput = document.getElementById("itemPrice");
  var themeBtn = document.getElementById("themeBtn");
  var themeIcon = document.getElementById("themeIcon");

  var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  var SUN = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>';

  function fmt(n) {
    return n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function render() {
    var total = items.reduce(function (sum, it) { return sum + it.price; }, 0);
    totalEl.textContent = "\u20B9" + fmt(total);
    countEl.textContent = items.length + " item" + (items.length === 1 ? "" : "s");
    clearBtn.style.display = items.length > 0 ? "" : "none";
    csvBtn.disabled = items.length === 0;
    pdfBtn.disabled = items.length === 0;

    if (items.length === 0) {
      listEl.className = "list";
      listEl.innerHTML = '<div class="empty"><p>Nothing added yet.</p><p>Add an item above to start your tally.</p></div>';
      return;
    }
    listEl.className = "list has-items";
    listEl.innerHTML = items.map(function (it) {
      return '<div class="item-row" data-id="' + it.id + '">' +
        '<span class="name">' + escapeHtml(it.name) + '</span>' +
        '<span class="leader"></span>' +
        '<span class="price num">\u20B9' + fmt(it.price) + '</span>' +
        '<button class="del" aria-label="Remove ' + escapeHtml(it.name) + '">' +
          '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
        '</button>' +
      '</div>';
    }).join("");

    var delButtons = listEl.querySelectorAll(".del");
    for (var i = 0; i < delButtons.length; i++) {
      delButtons[i].addEventListener("click", function (e) {
        var row = e.currentTarget.closest(".item-row");
        var id = parseInt(row.getAttribute("data-id"), 10);
        items = items.filter(function (it) { return it.id !== id; });
        render();
      });
    }
  }

  function addItem() {
    var name = nameInput.value.trim();
    var price = parseFloat(priceInput.value);
    if (!name || isNaN(price) || price < 0) return;
    items.push({ id: nextId++, name: name, price: price });
    nameInput.value = "";
    priceInput.value = "";
    nameInput.focus();
    render();
  }

  document.getElementById("addBtn").addEventListener("click", addItem);
  nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") addItem(); });
  priceInput.addEventListener("keydown", function (e) { if (e.key === "Enter") addItem(); });

  clearBtn.addEventListener("click", function () {
    items = [];
    render();
  });

  csvBtn.addEventListener("click", function () {
    var total = items.reduce(function (sum, it) { return sum + it.price; }, 0);
    var rows = [["Item", "Price"]];
    items.forEach(function (it) { rows.push([it.name, it.price.toFixed(2)]); });
    rows.push([]);
    rows.push(["Total", total.toFixed(2)]);
    var csv = rows.map(function (r) {
      return r.map(function (cell) {
        var s = String(cell == null ? "" : cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "kost-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  pdfBtn.addEventListener("click", function () { window.print(); });

  themeBtn.addEventListener("click", function () {
    theme = theme === "light" ? "dark" : "light";
    document.body.setAttribute("data-theme", theme);
    themeIcon.innerHTML = theme === "light" ? MOON : SUN;
  });

  document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });

  render();
})();
</script>
</body>
</html>
