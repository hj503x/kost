<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KOsT — a running tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }

  [data-theme="light"] { --bg:#EFEBE1; --surface:#FCFAF4; --ink:#211E18; --ink-soft:#6E6858; --line:#DCD5C2; --rule:#E4DFCF; --accent:#33513B; --accent-soft:#EDF2EC; --danger:#A6402F; --danger-soft:#F7E9E5; --shadow:0 24px 60px -30px rgba(33,30,24,.35); }
  [data-theme="dark"]  { --bg:#131210; --surface:#1D1B16; --ink:#EEE9DC; --ink-soft:#9A927F; --line:#38352A; --rule:#28251D; --accent:#8FBB96; --accent-soft:#22291F; --danger:#D48D78; --danger-soft:#2C201B; --shadow:0 24px 60px -24px rgba(0,0,0,.6); }

  html, body { height: 100%; }
  body {
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    padding: 48px 16px; background: var(--bg); transition: background .35s ease;
    font-family: 'IBM Plex Sans', Arial, sans-serif;
  }
  .wrap { width: 100%; max-width: 640px; }
  .num { font-family: 'IBM Plex Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; }
  .serif { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; }

  .card { background: var(--surface); box-shadow: var(--shadow); animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .top-row { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
  #themeBtn, #currencyBtn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .2s ease;
  }
  #currencyBtn { font-size: 15px; color: var(--ink); font-family: 'IBM Plex Mono', monospace; }
  #themeBtn:hover { transform: rotate(-14deg); }
  #currencyBtn:hover, #themeBtn:active, #currencyBtn:active { transform: scale(.92); }
  #themeBtn:focus-visible, #currencyBtn:focus-visible, .del:focus-visible, .date-edit-btn:focus-visible, #addBtn:focus-visible, .export-btn:focus-visible,
  #clearBtn:focus-visible, .day-toggle:focus-visible, #dateToggle:focus-visible, #categoryToggle:focus-visible, #searchInput:focus-visible,
  .undo-btn:focus-visible, .day-header:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  #themeBtn svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .header { padding: 36px 40px 20px; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px dashed var(--line); }
  .header .icon { color: var(--accent); margin-bottom: 4px; }
  .header .icon svg { width: 18px; height: 18px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; font-size: 32px; color: var(--ink); margin: 0; }
  .tagline { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); }
  .date { font-size: 12px; color: var(--ink-soft); }

  /* ---- stats strip: today / week / month rollups ---- */
  .stats { display: flex; border-bottom: 1px dashed var(--line); }
  .stats .stat { flex: 1; padding: 16px 12px; text-align: center; border-right: 1px dashed var(--line); }
  .stats .stat:last-child { border-right: none; }
  .stats .stat .stat-label { font-size: 11px; color: var(--ink-soft); margin: 0 0 4px; }
  .stats .stat .stat-amount { font-size: 15px; color: var(--ink); font-weight: 600; }

  .add-row { display: flex; align-items: center; gap: 10px; padding: 20px 40px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .add-row.shake { animation: shake .38s ease; }
  @keyframes shake { 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }
  .add-row input { background: transparent; border: none; outline: none; color: var(--ink); font-family: 'IBM Plex Sans', Arial, sans-serif; font-size: 15px; }
  .add-row input::placeholder { color: var(--ink-soft); }
  #itemName { flex: 1 1 auto; min-width: 90px; }
  #itemQty { width: 58px; }
  #itemPrice { width: 92px; text-align: right; }
  .add-row input.invalid::placeholder { color: var(--danger); }
  #dateToggle, #categoryToggle, #addBtn {
    width: 32px; height: 32px; min-width: 32px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s ease;
  }
  #dateToggle, #categoryToggle { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }
  #dateToggle.active, #categoryToggle.active { border-color: var(--accent); color: var(--accent); }
  #dateToggle svg, #categoryToggle svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #addBtn { background: var(--accent); color: var(--surface); }
  #addBtn:active, #dateToggle:active, #categoryToggle:active { transform: scale(.94); }
  #addBtn svg { width: 16px; height: 16px; stroke: var(--surface); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .date-row { display: none; padding: 0 40px 16px; margin-top: -8px; border-bottom: 1px dashed var(--line); }
  .date-row.open { display: block; padding-bottom: 16px; }
  .date-row input[type="date"] {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; outline: none;
  }
  .date-row label { font-size: 12px; color: var(--ink-soft); margin-right: 8px; }

  .qty-hint { margin: -10px 40px 14px; font-size: 11px; color: var(--ink-soft); }

  .search-row { padding: 14px 40px 0; }
  .search-row input {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; color: var(--ink); outline: none; font-family: inherit;
  }
  .search-row input:focus { border-color: var(--accent); }
  .search-row input::placeholder { color: var(--ink-soft); }

  .list { max-height: 55vh; overflow-y: auto; background-image: repeating-linear-gradient(to bottom, transparent, transparent 33px, var(--rule) 34px); background-position: 0 4px; }
  .list.has-items { padding: 18px 40px 8px; }
  .empty { text-align: center; padding: 40px 32px; color: var(--ink-soft); }
  .empty p:first-child { margin: 0; font-size: 14px; color: var(--ink); }
  .empty p:last-child { margin: 4px 0 0; font-size: 13px; }
  .no-results { text-align: center; padding: 28px 32px; color: var(--ink-soft); font-size: 13px; }

  .day-group + .day-group { margin-top: 6px; }
  .day-header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 6px;
    cursor: pointer; padding: 4px 0; user-select: none;
  }
  .day-header .day-left { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .day-toggle { border: none; background: none; padding: 0; cursor: pointer; display: flex; color: var(--ink-soft); flex: none; }
  .day-toggle svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .18s ease; }
  .day-group.collapsed .day-toggle svg { transform: rotate(-90deg); }
  .day-label { font-size: 13px; color: var(--ink); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-total { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); flex: none; }
  .day-items { overflow: hidden; }
  .day-group.collapsed .day-items { display: none; }

  .item-row { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; animation: itemIn .32s ease-out both; }
  @keyframes itemIn { from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  .item-row .name {
    font-size: 14px; color: var(--ink); cursor: text; border-radius: 3px; padding: 1px 3px; margin: -1px -3px;
    max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    border-bottom: 1px dotted var(--line);
  }
  .item-row .name:hover, .item-row .price:hover, .item-row .qty-badge:hover { background: var(--line); }
  .item-row .category-badge {
    font-size: 10px; color: var(--accent); background: var(--accent-soft); border-radius: 999px;
    padding: 2px 7px; white-space: nowrap; flex: none;
  }
  .item-row .qty-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft);
    cursor: text; border-radius: 3px; padding: 1px 4px; margin: -1px 0 -1px -3px;
    white-space: nowrap; border-bottom: 1px dotted var(--line);
  }
  .item-row .edit-input.qty-edit { width: 44px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .item-row .leader { flex: 1 1 auto; border-bottom: 1px dotted var(--line); transform: translateY(-4px); }
  .item-row .price { font-size: 14px; color: var(--ink); cursor: text; border-radius: 3px; padding: 1px 3px; margin: -1px -3px; white-space: nowrap; border-bottom: 1px dotted var(--line); }
  .item-row .price .unit { color: var(--ink-soft); font-size: 12px; margin-right: 4px; }
  .item-row .edit-input {
    font-family: inherit; font-size: 14px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--accent); border-radius: 3px; padding: 0 3px; outline: none;
  }
  .item-row .edit-input.price-edit { width: 70px; text-align: right; font-family: 'IBM Plex Mono', monospace; }
  .item-row .edit-input.invalid-shake { animation: shake .38s ease; border-color: var(--danger); }
  .item-row .del, .item-row .date-edit-btn {
    opacity: 0; border: none; background: none; cursor: pointer;
    display: flex; padding: 2px; transition: opacity .15s ease;
  }
  .item-row .del { color: var(--danger); }
  .item-row .date-edit-btn { color: var(--ink-soft); }
  .item-row:hover .del, .item-row:focus-within .del,
  .item-row:hover .date-edit-btn, .item-row:focus-within .date-edit-btn { opacity: 1; }
  .item-row .del svg { width: 13px; height: 13px; stroke: var(--danger); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .item-row .date-edit-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .item-row .date-edit-input {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; width: 118px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--accent); border-radius: 3px; padding: 1px 3px; outline: none;
  }

  @media (hover: none) {
    .item-row .del, .item-row .date-edit-btn { opacity: .55; }
  }

  .total-row { margin: 8px 40px 0; padding-top: 14px; border-top: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; }
  .total-row .label { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: 17px; color: var(--ink); }
  .total-row .amount { font-size: 22px; font-weight: 600; color: var(--accent); }

  .footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 40px 28px; flex-wrap: wrap; gap: 10px; }
  .count { font-size: 12px; color: var(--ink-soft); }
  .actions { display: flex; align-items: center; gap: 16px; }
  #clearBtn { border: none; background: none; cursor: pointer; font-size: 12px; color: var(--ink-soft); text-decoration: underline; padding: 0; }
  .export-btn {
    display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 7px 12px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer; transition: border-color .2s ease, color .2s ease;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }
  .export-btn:disabled { opacity: .45; cursor: not-allowed; }
  .export-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .export-note { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 0 40px 22px; margin-top: -8px; }
  .storage-warning { text-align: center; font-size: 11px; color: var(--danger); background: var(--danger-soft); padding: 8px 16px; margin: 0 40px 22px; border-radius: 6px; }

  /* ---- undo toast ---- */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px); opacity: 0;
    pointer-events: none; background: var(--ink); color: var(--surface); font-size: 13px;
    padding: 10px 10px 10px 16px; border-radius: 999px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,.4); transition: opacity .2s ease, transform .2s ease; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast .undo-btn { border: none; background: var(--accent); color: var(--surface); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    .card, .item-row, .add-row.shake, .invalid-shake { animation: none !important; }
  }

  @media (max-width: 420px) {
    .stats .stat { padding: 12px 6px; }
    .stats .stat-label { font-size: 10px; }
    .stats .stat-amount { font-size: 13px; }
    .header, .add-row, .list.has-items, .total-row, .footer, .search-row, .date-row { padding-left: 22px; padding-right: 22px; }
    .total-row { margin-left: 22px; margin-right: 22px; }
    .qty-hint { margin-left: 22px; margin-right: 22px; }
  }

  @media print {
    body { background: #fff !important; padding: 0 !important; }
    .noprint { display: none !important; }
    .list { max-height: none !important; overflow: visible !important; background-image: none !important; }
    .day-group.collapsed .day-items { display: block !important; }
    .card { box-shadow: none !important; animation: none !important; }
    [data-theme] { --surface:#fff; --ink:#000; --ink-soft:#555; --bg:#fff; --line:#ccc; --rule:#eee; --accent:#000; }
  }
</style>
</head>
<body data-theme="light">
<svg style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
  <symbol id="icon-calendar" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
  </symbol>
</svg>
<div class="wrap">
  <div class="top-row noprint">
    <button id="currencyBtn" aria-label="Change currency" title="Change currency">₹</button>
    <button id="themeBtn" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="card">
    <div class="header">
      <div>
        <div class="icon">
          <svg viewBox="0 0 24 24"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>
        </div>
        <h1>KOsT</h1>
        <p class="tagline">a running tally of what you spend</p>
      </div>
      <span class="date num" id="todayLabel"></span>
    </div>

    <div class="stats noprint" id="statsRow" style="display:none;">
      <div class="stat"><p class="stat-label">Today</p><p class="stat-amount num" id="statToday">0.00</p></div>
      <div class="stat"><p class="stat-label">This week</p><p class="stat-amount num" id="statWeek">0.00</p></div>
      <div class="stat"><p class="stat-label">This month</p><p class="stat-amount num" id="statMonth">0.00</p></div>
    </div>

    <div class="add-row noprint" id="addRow">
      <input id="itemName" type="text" placeholder="Item" aria-label="Item name" />
      <input id="itemQty" type="text" placeholder="Qty" aria-label="Quantity, optional" title="Optional — a number multiplies the price (e.g. 2), text is just a note (e.g. 2kg)" />
      <input id="itemPrice" class="num" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" aria-label="Price" />
      <button id="categoryToggle" aria-label="Add a category" title="Add a category">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L4 3a1 1 0 0 0-1 1l.24 5.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.82Z"/><circle cx="7.5" cy="7.5" r="1"/></svg>
      </button>
      <button id="dateToggle" aria-label="Backdate this entry" title="Backdate this entry">
        <svg viewBox="0 0 24 24"><use href="#icon-calendar"/></svg>
      </button>
      <button id="addBtn" aria-label="Add item">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="date-row noprint" id="categoryRow">
      <label for="itemCategory">Category</label>
      <input type="text" id="itemCategory" placeholder="e.g. Food, Travel" style="font-family: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; outline: none;" />
    </div>
    <div class="date-row noprint" id="dateRow">
      <label for="itemDate">Entry date</label>
      <input type="date" id="itemDate" />
    </div>
    <p class="qty-hint noprint">Tip: a plain number in Qty multiplies the price — anything else (like "2kg") is just a note.</p>

    <div class="search-row noprint" id="searchRow" style="display:none;">
      <input id="searchInput" type="text" placeholder="Search items…" />
    </div>

    <div class="list" id="list"></div>

    <div class="total-row">
      <span class="label serif">Total</span>
      <span class="amount num" id="totalAmount">0.00</span>
    </div>

    <div class="footer">
      <span class="count" id="itemCount">0 items</span>
      <div class="actions noprint">
        <button id="clearBtn" style="display:none;">Clear all</button>
        <button class="export-btn" id="csvBtn" disabled>
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          CSV
        </button>
        <button class="export-btn" id="pdfBtn" disabled>
          <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          PDF
        </button>
        <button class="export-btn" id="jsonBtn" disabled title="Full backup you can re-import later">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Backup
        </button>
        <button class="export-btn" id="importBtn" title="Restore from a backup file">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Restore
        </button>
        <input type="file" id="importFile" accept="application/json" style="display:none;" />
      </div>
    </div>
    <p class="export-note noprint" id="exportNote" style="display:none;"></p>
    <p class="storage-warning noprint" id="storageWarning" style="display:none;">Changes aren't being saved on this device — your data may be lost on refresh.</p>
  </div>
</div>

<div class="toast noprint" id="toast">
  <span id="toastMsg">Item removed</span>
  <button class="undo-btn" id="undoBtn">Undo</button>
</div>

<script>
(function () {
  var STORAGE_KEY = "kost-items-v1";
  var THEME_KEY = "kost-theme-v1";
  var EXPORT_KEY = "kost-last-export-v1";
  var COLLAPSE_KEY = "kost-collapsed-days-v1";
  var SEARCH_THRESHOLD = 15;

  var items = [];
  var nextId = 1;
  var theme = "light";
  var themeIsManual = false;
  var displayedTotal = 0;
  var totalAnimHandle = null;
  var collapsedDays = {};
  var searchTerm = "";
  var lastExportAt = null;

  var pendingDeletes = []; // [{ item, index }], most recent last
  var storageWarned = false;

  var listEl = document.getElementById("list");
  var totalEl = document.getElementById("totalAmount");
  var countEl = document.getElementById("itemCount");
  var clearBtn = document.getElementById("clearBtn");
  var csvBtn = document.getElementById("csvBtn");
  var pdfBtn = document.getElementById("pdfBtn");
  var jsonBtn = document.getElementById("jsonBtn");
  var importBtn = document.getElementById("importBtn");
  var importFile = document.getElementById("importFile");
  var nameInput = document.getElementById("itemName");
  var qtyInput = document.getElementById("itemQty");
  var priceInput = document.getElementById("itemPrice");
  var dateInput = document.getElementById("itemDate");
  var categoryInput = document.getElementById("itemCategory");
  var addRow = document.getElementById("addRow");
  var dateRow = document.getElementById("dateRow");
  var categoryRow = document.getElementById("categoryRow");
  var dateToggle = document.getElementById("dateToggle");
  var categoryToggle = document.getElementById("categoryToggle");
  var currencyBtn = document.getElementById("currencyBtn");
  var themeBtn = document.getElementById("themeBtn");
  var themeIcon = document.getElementById("themeIcon");
  var statsRow = document.getElementById("statsRow");
  var statToday = document.getElementById("statToday");
  var statWeek = document.getElementById("statWeek");
  var statMonth = document.getElementById("statMonth");
  var searchRow = document.getElementById("searchRow");
  var searchInput = document.getElementById("searchInput");
  var exportNote = document.getElementById("exportNote");
  var toast = document.getElementById("toast");
  var toastMsg = document.getElementById("toastMsg");
  var undoBtn = document.getElementById("undoBtn");

  var MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  var SUN = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>';
  var CHEVRON = '<polyline points="6 9 12 15 18 9"/>';

  var CURRENCIES = ["\u20B9", "$", "\u20AC", "\u00A3"];
  var CURRENCY_KEY = "kost-currency-v1";
  var currency = CURRENCIES[0];

  function fmt(n) {
    return currency + n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  function keyFor(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

  function todayKey() { return keyFor(new Date()); }

  function parseKey(dateKey) {
    var parts = dateKey.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function dayLabelFor(dateKey) {
    var today = todayKey();
    if (dateKey === today) return "Today";
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (dateKey === keyFor(yesterday)) return "Yesterday";
    return parseKey(dateKey).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
  }

  // qty that is purely numeric acts as a multiplier on price; anything else (e.g. "2kg") is just a note
  function qtyMultiplier(qty) {
    if (!qty) return null;
    var trimmed = String(qty).trim();
    if (!/^\d+(\.\d+)?$/.test(trimmed)) return null;
    var n = parseFloat(trimmed);
    return n > 0 ? n : null;
  }

  function lineTotal(it) {
    var m = qtyMultiplier(it.qty);
    return m ? m * it.price : it.price;
  }

  // ---------- persistence ----------
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: items, nextId: nextId }));
      if (storageWarned) {
        storageWarned = false;
        document.getElementById("storageWarning").style.display = "none";
      }
    } catch (e) {
      // storage unavailable (private browsing, quota full, etc.) — in-memory state still works this session
      if (!storageWarned) {
        storageWarned = true;
        document.getElementById("storageWarning").style.display = "";
      }
    }
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.items)) {
          items = parsed.items;
          nextId = parsed.nextId || (items.reduce(function (m, it) { return Math.max(m, it.id); }, 0) + 1);
        }
      }
      var savedCurrency = localStorage.getItem(CURRENCY_KEY);
      if (savedCurrency && CURRENCIES.indexOf(savedCurrency) !== -1) currency = savedCurrency;
      var savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme === "light" || savedTheme === "dark") {
        theme = savedTheme;
        themeIsManual = true;
      } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        theme = "dark";
      }
      var savedExport = localStorage.getItem(EXPORT_KEY);
      if (savedExport) lastExportAt = new Date(savedExport);
      var savedCollapse = localStorage.getItem(COLLAPSE_KEY);
      if (savedCollapse) { try { collapsedDays = JSON.parse(savedCollapse); } catch (e2) {} }
    } catch (e) { /* storage unavailable — start fresh */ }
  }

  function saveCollapse() {
    try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsedDays)); } catch (e) {}
  }

  function markExported() {
    lastExportAt = new Date();
    try { localStorage.setItem(EXPORT_KEY, lastExportAt.toISOString()); } catch (e) {}
    renderExportNote();
  }

  function renderExportNote() {
    if (!items.length) { exportNote.style.display = "none"; return; }
    if (!lastExportAt) {
      exportNote.style.display = "";
      exportNote.textContent = "Not exported yet — back this up with CSV once in a while.";
      return;
    }
    var days = Math.floor((Date.now() - lastExportAt.getTime()) / 86400000);
    if (days < 1) { exportNote.style.display = "none"; return; }
    exportNote.style.display = "";
    exportNote.textContent = "Last exported " + days + " day" + (days === 1 ? "" : "s") + " ago — everything lives only on this device.";
  }

  // ---------- rendering ----------
  function animateTotal(target) {
    if (totalAnimHandle) cancelAnimationFrame(totalAnimHandle);
    var start = displayedTotal;
    var startTime = null;
    var duration = 260;
    function step(ts) {
      if (startTime === null) startTime = ts;
      var progress = Math.min(1, (ts - startTime) / duration);
      var eased = 1 - Math.pow(1 - progress, 3);
      var value = start + (target - start) * eased;
      totalEl.textContent = fmt(value);
      if (progress < 1) {
        totalAnimHandle = requestAnimationFrame(step);
      } else {
        displayedTotal = target;
      }
    }
    totalAnimHandle = requestAnimationFrame(step);
  }

  function groupByDay(list) {
    var order = [];
    var map = {};
    list.forEach(function (it) {
      var key = it.date || todayKey();
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(it);
    });
    // Keys are YYYY-MM-DD, so plain string comparison sorts chronologically — newest first.
    order.sort(function (a, b) { return a < b ? 1 : -1; });
    return order.map(function (key) { return { date: key, items: map[key] }; });
  }

  function renderStats() {
    if (!items.length) { statsRow.style.display = "none"; return; }
    statsRow.style.display = "flex";
    var now = new Date();
    var todayK = todayKey();
    var weekAgo = new Date(); weekAgo.setDate(now.getDate() - 6);
    var monthKeyPrefix = now.getFullYear() + "-" + pad(now.getMonth() + 1);

    var todaySum = 0, weekSum = 0, monthSum = 0;
    items.forEach(function (it) {
      var key = it.date || todayK;
      var total = lineTotal(it);
      if (key === todayK) todaySum += total;
      var d = parseKey(key);
      if (d >= new Date(weekAgo.getFullYear(), weekAgo.getMonth(), weekAgo.getDate())) weekSum += total;
      if (key.indexOf(monthKeyPrefix) === 0) monthSum += total;
    });
    statToday.textContent = fmt(todaySum);
    statWeek.textContent = fmt(weekSum);
    statMonth.textContent = fmt(monthSum);
  }

  function matchesSearch(it) {
    if (!searchTerm) return true;
    if (it.name.toLowerCase().indexOf(searchTerm) !== -1) return true;
    if (it.qty && String(it.qty).toLowerCase().indexOf(searchTerm) !== -1) return true;
    if (it.category && it.category.toLowerCase().indexOf(searchTerm) !== -1) return true;
    var dateKey = it.date || todayKey();
    if (dateKey.indexOf(searchTerm) !== -1) return true;
    return dayLabelFor(dateKey).toLowerCase().indexOf(searchTerm) !== -1;
  }

  function render() {
    var total = items.reduce(function (sum, it) { return sum + lineTotal(it); }, 0);
    animateTotal(total);
    countEl.textContent = items.length + " item" + (items.length === 1 ? "" : "s");
    clearBtn.style.display = items.length > 0 ? "" : "none";
    csvBtn.disabled = items.length === 0;
    pdfBtn.disabled = items.length === 0;
    jsonBtn.disabled = items.length === 0;
    searchRow.style.display = items.length > SEARCH_THRESHOLD ? "" : "none";
    renderStats();
    renderExportNote();

    if (items.length === 0) {
      listEl.className = "list";
      listEl.innerHTML = '<div class="empty"><p>Nothing added yet.</p><p>Add an item above to start your tally.</p></div>';
      return;
    }
    listEl.className = "list has-items";

    var groups = groupByDay(items);
    var showDayHeaders = groups.length > 1;
    var visibleGroups = groups.map(function (g) {
      return { date: g.date, items: g.items.filter(matchesSearch) };
    }).filter(function (g) { return g.items.length > 0; });

    if (searchTerm && visibleGroups.length === 0) {
      listEl.innerHTML = '<div class="no-results">No items match "' + escapeHtml(searchTerm) + '".</div>';
      return;
    }

    listEl.innerHTML = visibleGroups.map(function (group, idx) {
      var dayTotal = group.items.reduce(function (sum, it) { return sum + lineTotal(it); }, 0);
      // default: today + yesterday expanded, everything else collapsed on first encounter
      if (!(group.date in collapsedDays)) {
        collapsedDays[group.date] = idx >= 2;
      }
      var isCollapsed = showDayHeaders && collapsedDays[group.date] && !searchTerm;
      var header = showDayHeaders
        ? '<div class="day-header" data-date="' + group.date + '" role="button" tabindex="0" aria-expanded="' + (!isCollapsed) + '" aria-label="Toggle ' + escapeHtml(dayLabelFor(group.date)) + '">' +
            '<span class="day-left">' +
              '<button class="day-toggle" aria-label="Toggle day" tabindex="-1">' +
                '<svg viewBox="0 0 24 24">' + CHEVRON + '</svg>' +
              '</button>' +
              '<span class="day-label serif">' + escapeHtml(dayLabelFor(group.date)) + '</span>' +
            '</span>' +
            '<span class="day-total num">' + fmt(dayTotal) + '</span>' +
          '</div>'
        : '';
      var rows = group.items.map(function (it) {
        var qtyBadge = it.qty
          ? '<span class="qty-badge" data-field="qty" role="button" tabindex="0" aria-label="Edit quantity, currently ' + escapeHtml(it.qty) + '">' + escapeHtml(it.qty) + '</span>'
          : '';
        var mult = qtyMultiplier(it.qty);
        var priceDisplay = mult
          ? '<span class="unit">' + mult + '&times;' + fmt(it.price) + ' =</span>' + fmt(mult * it.price)
          : fmt(it.price);
        var categoryBadge = it.category
          ? '<span class="category-badge">' + escapeHtml(it.category) + '</span>'
          : '';
        return '<div class="item-row" data-id="' + it.id + '">' +
          qtyBadge +
          '<span class="name" data-field="name" role="button" tabindex="0" aria-label="Edit name, currently ' + escapeHtml(it.name) + '">' + escapeHtml(it.name) + '</span>' +
          categoryBadge +
          '<span class="leader"></span>' +
          '<span class="price num" data-field="price" role="button" tabindex="0" aria-label="Edit price, currently ' + fmt(it.price) + '">' + priceDisplay + '</span>' +
          '<button class="date-edit-btn" aria-label="Change date" title="Change date">' +
            '<svg viewBox="0 0 24 24"><use href="#icon-calendar"/></svg>' +
          '</button>' +
          '<button class="del" aria-label="Remove ' + escapeHtml(it.name) + '">' +
            '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          '</button>' +
        '</div>';
      }).join("");
      return '<div class="day-group' + (isCollapsed ? " collapsed" : "") + '">' + header +
        '<div class="day-items">' + rows + '</div></div>';
    }).join("");

    saveCollapse();

    var toggles = listEl.querySelectorAll(".day-header");
    var toggleDay = function (e) {
      var date = e.currentTarget.getAttribute("data-date");
      collapsedDays[date] = !collapsedDays[date];
      saveCollapse();
      render();
    };
    for (var t = 0; t < toggles.length; t++) {
      toggles[t].addEventListener("click", toggleDay);
      toggles[t].addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleDay(e); }
      });
    }

    var dateEditButtons = listEl.querySelectorAll(".date-edit-btn");
    for (var d = 0; d < dateEditButtons.length; d++) {
      dateEditButtons[d].addEventListener("click", function (e) {
        e.stopPropagation();
        startDateEdit(e);
      });
    }

    var delButtons = listEl.querySelectorAll(".del");
    for (var i = 0; i < delButtons.length; i++) {
      delButtons[i].addEventListener("click", function (e) {
        e.stopPropagation();
        var row = e.currentTarget.closest(".item-row");
        var id = parseInt(row.getAttribute("data-id"), 10);
        deleteItem(id);
      });
    }

    var editable = listEl.querySelectorAll("[data-field]");
    for (var j = 0; j < editable.length; j++) {
      editable[j].addEventListener("click", function (e) { e.stopPropagation(); startEdit(e); });
      editable[j].addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); startEdit(e); }
      });
    }
  }

  // ---------- delete with undo ----------
  // Deletes within the toast window are batched, so undo restores every item
  // removed in that burst rather than losing all but the most recent one.
  var toastTimeout = null;
  function deleteItem(id) {
    var idx = items.findIndex(function (it) { return it.id === id; });
    if (idx === -1) return;
    var removed = items[idx];
    var removedIdx = idx;
    items = items.filter(function (it) { return it.id !== id; });
    save();
    render();

    pendingDeletes.push({ item: removed, index: removedIdx });
    if (pendingDeletes.length > 1) {
      toastMsg.textContent = pendingDeletes.length + " items removed";
    } else {
      toastMsg.textContent = '"' + (removed.name.length > 24 ? removed.name.slice(0, 24) + '…' : removed.name) + '" removed';
    }
    toast.classList.add("show");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function () { toast.classList.remove("show"); pendingDeletes = []; }, 8000);
  }

  undoBtn.addEventListener("click", function () {
    if (!pendingDeletes.length) return;
    clearTimeout(toastTimeout);
    // Restore in original order, each at its remembered position (clamped as the array grows back).
    pendingDeletes
      .slice()
      .sort(function (a, b) { return a.index - b.index; })
      .forEach(function (pd) {
        var insertAt = Math.min(pd.index, items.length);
        items.splice(insertAt, 0, pd.item);
      });
    pendingDeletes = [];
    toast.classList.remove("show");
    save();
    render();
  });

  // ---------- inline editing ----------
  function flagInvalidEdit(input) {
    input.classList.remove("invalid-shake");
    void input.offsetWidth; // restart animation
    input.classList.add("invalid-shake");
    input.focus();
    input.select();
  }

  function startEdit(e) {
    var span = e.currentTarget;
    if (span.querySelector("input")) return; // already editing
    var row = span.closest(".item-row");
    var id = parseInt(row.getAttribute("data-id"), 10);
    var item = items.find(function (it) { return it.id === id; });
    if (!item) return;
    var field = span.getAttribute("data-field");

    var input = document.createElement("input");
    input.className = "edit-input" + (field === "price" ? " price-edit" : field === "qty" ? " qty-edit" : "");
    if (field === "price") {
      input.type = "number";
      input.step = "0.01";
      input.min = "0";
      input.value = item.price;
    } else if (field === "qty") {
      input.type = "text";
      input.value = item.qty || "";
      input.placeholder = "Qty";
    } else {
      input.type = "text";
      input.value = item.name;
    }

    span.textContent = "";
    span.appendChild(input);
    input.focus();
    input.select();

    function commit() {
      if (field === "price") {
        var p = parseFloat(input.value);
        if (!isNaN(p) && p >= 0) {
          item.price = p;
        } else {
          flagInvalidEdit(input);
          return;
        }
      } else if (field === "qty") {
        item.qty = input.value.trim();
      } else {
        var n = input.value.trim();
        if (n) {
          item.name = n;
        } else {
          flagInvalidEdit(input);
          return;
        }
      }
      save();
      render();
    }

    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
      if (ev.key === "Escape") { ev.preventDefault(); render(); }
    });
  }

  function startDateEdit(e) {
    var btn = e.currentTarget;
    var row = btn.closest(".item-row");
    var id = parseInt(row.getAttribute("data-id"), 10);
    var item = items.find(function (it) { return it.id === id; });
    if (!item) return;

    var input = document.createElement("input");
    input.type = "date";
    input.className = "edit-input date-edit-input";
    input.max = todayKey();
    input.value = item.date || todayKey();
    btn.replaceWith(input);
    input.focus();

    function commit() {
      var v = input.value;
      if (v && v !== item.date) {
        item.date = v;
        delete collapsedDays[v]; // let the destination day re-evaluate its default expand state
      }
      save();
      render();
    }

    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); input.blur(); }
      if (ev.key === "Escape") { ev.preventDefault(); render(); }
    });
  }

  // ---------- search ----------
  searchInput.addEventListener("input", function () {
    searchTerm = searchInput.value.trim().toLowerCase();
    render();
  });

  // ---------- backdating ----------
  dateToggle.addEventListener("click", function () {
    var willOpen = !dateRow.classList.contains("open");
    dateRow.classList.toggle("open", willOpen);
    dateToggle.classList.toggle("active", willOpen);
    dateInput.max = todayKey();
    if (willOpen && !dateInput.value) dateInput.value = todayKey();
  });

  // ---------- category ----------
  categoryToggle.addEventListener("click", function () {
    var willOpen = !categoryRow.classList.contains("open");
    categoryRow.classList.toggle("open", willOpen);
    categoryToggle.classList.toggle("active", willOpen);
    if (willOpen) categoryInput.focus();
  });

  // ---------- add / clear ----------
  function flagInvalid() {
    addRow.classList.remove("shake");
    void addRow.offsetWidth; // restart animation
    addRow.classList.add("shake");
    setTimeout(function () { addRow.classList.remove("shake"); }, 400);
  }

  function addItem() {
    var name = nameInput.value.trim();
    var price = parseFloat(priceInput.value);
    if (!name || isNaN(price) || price < 0) {
      flagInvalid();
      if (!name) nameInput.classList.add("invalid"); else nameInput.classList.remove("invalid");
      if (isNaN(price) || price < 0) priceInput.classList.add("invalid"); else priceInput.classList.remove("invalid");
      setTimeout(function () {
        nameInput.classList.remove("invalid");
        priceInput.classList.remove("invalid");
      }, 900);
      return;
    }
    var qty = qtyInput.value.trim();
    var entryDate = (dateRow.classList.contains("open") && dateInput.value) ? dateInput.value : todayKey();
    var category = (categoryRow.classList.contains("open") && categoryInput.value.trim()) ? categoryInput.value.trim() : "";
    if (entryDate in collapsedDays) delete collapsedDays[entryDate]; // let a fresh entry's day expand
    items.push({ id: nextId++, name: name, price: price, qty: qty, date: entryDate, category: category });
    nameInput.value = "";
    qtyInput.value = "";
    priceInput.value = "";
    nameInput.focus();
    save();
    render();
  }

  document.getElementById("addBtn").addEventListener("click", addItem);
  nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") addItem(); });
  qtyInput.addEventListener("keydown", function (e) { if (e.key === "Enter") addItem(); });
  priceInput.addEventListener("keydown", function (e) { if (e.key === "Enter") addItem(); });

  clearBtn.addEventListener("click", function () {
    if (items.length && !confirm("Clear all items? This can't be undone.")) return;
    items = [];
    collapsedDays = {};
    saveCollapse();
    save();
    render();
  });

  csvBtn.addEventListener("click", function () {
    var total = items.reduce(function (sum, it) { return sum + lineTotal(it); }, 0);
    var rows = [["Date", "Item", "Category", "Qty", "Unit Price", "Line Total"]];
    items.forEach(function (it) { rows.push([it.date || todayKey(), it.name, it.category || "", it.qty || "", it.price.toFixed(2), lineTotal(it).toFixed(2)]); });
    rows.push([]);
    rows.push(["", "", "", "", "Total", total.toFixed(2)]);
    var csv = rows.map(function (r) {
      return r.map(function (cell) {
        var s = String(cell == null ? "" : cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "kost-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    markExported();
  });

  jsonBtn.addEventListener("click", function () {
    var backup = { items: items, nextId: nextId, exportedAt: new Date().toISOString() };
    var blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "kost-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    markExported();
  });

  importBtn.addEventListener("click", function () { importFile.click(); });

  importFile.addEventListener("change", function () {
    var file = importFile.files && importFile.files[0];
    importFile.value = ""; // reset so re-selecting the same file fires change again
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.items)) throw new Error("bad shape");
        if (items.length && !confirm("Import will replace all " + items.length + " current item(s) with the backup. Continue?")) return;
        items = parsed.items;
        nextId = parsed.nextId || (items.reduce(function (m, it) { return Math.max(m, it.id); }, 0) + 1);
        collapsedDays = {};
        saveCollapse();
        save();
        render();
      } catch (e) {
        alert("That file doesn't look like a valid KOsT backup.");
      }
    };
    reader.readAsText(file);
  });

  pdfBtn.addEventListener("click", function () {
    var snapshot = Object.assign({}, collapsedDays);
    Object.keys(collapsedDays).forEach(function (k) { collapsedDays[k] = false; });
    render();
    function restore() {
      window.removeEventListener("afterprint", restore);
      collapsedDays = snapshot;
      saveCollapse();
      render();
    }
    window.addEventListener("afterprint", restore);
    window.print();
    markExported();
  });

  currencyBtn.addEventListener("click", function () {
    var idx = (CURRENCIES.indexOf(currency) + 1) % CURRENCIES.length;
    currency = CURRENCIES[idx];
    currencyBtn.textContent = currency;
    try { localStorage.setItem(CURRENCY_KEY, currency); } catch (e) { /* ignore */ }
    render();
  });

  themeBtn.addEventListener("click", function () {
    theme = theme === "light" ? "dark" : "light";
    themeIsManual = true;
    document.body.setAttribute("data-theme", theme);
    themeIcon.innerHTML = theme === "light" ? MOON : SUN;
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* ignore */ }
  });

  if (window.matchMedia) {
    var osThemeQuery = window.matchMedia("(prefers-color-scheme: dark)");
    var handleOsThemeChange = function (ev) {
      if (themeIsManual) return; // user has an explicit preference — don't override it
      theme = ev.matches ? "dark" : "light";
      document.body.setAttribute("data-theme", theme);
      themeIcon.innerHTML = theme === "light" ? MOON : SUN;
    };
    if (osThemeQuery.addEventListener) osThemeQuery.addEventListener("change", handleOsThemeChange);
    else if (osThemeQuery.addListener) osThemeQuery.addListener(handleOsThemeChange); // older Safari
  }

  document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });

  // ---------- init ----------
  load();
  currencyBtn.textContent = currency;
  document.body.setAttribute("data-theme", theme);
  themeIcon.innerHTML = theme === "light" ? MOON : SUN;
  render();
})();
</script>
</body>
</html>
