<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOsT — a running tally</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0}
[data-theme=light]{--bg:#EFEBE1;--sf:#FCFAF4;--ink:#211E18;--soft:#6E6858;--line:#DCD5C2;--ac:#33513B;--bad:#A6402F}
[data-theme=dark]{--bg:#131210;--sf:#1D1B16;--ink:#EEE9DC;--soft:#9A927F;--line:#38352A;--ac:#8FBB96;--bad:#D48D78}
body{background:var(--bg);color:var(--ink);font:14px/1.4 'IBM Plex Sans',Arial,sans-serif;padding:24px 14px 80px}
.wrap{max-width:980px;margin:0 auto}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.soft{color:var(--soft)}small{color:var(--soft);font-size:11px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand svg{width:18px;height:18px;stroke:var(--ac);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin-bottom:4px}
.brand p{margin:6px 0 0;font-size:13px;color:var(--soft)}
h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:500;font-size:32px;line-height:1.1;margin:0}
.nav{display:flex;align-items:center;gap:6px}
.nav button,.ib{border:1px solid var(--line);background:var(--sf);border-radius:999px;height:34px;min-width:34px;padding:0 12px}
.nav button:hover,.ib:hover{border-color:var(--ac);color:var(--ac)}
#mlabel{font-weight:600;min-width:130px;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sf)}.seg button{border:0;background:none;padding:0 14px;height:32px}.seg button.on{background:var(--ac);color:var(--sf)}
.ptitle{display:none;font-size:20px;font-weight:600;margin:0 0 10px}
.sum{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:0}
.sum>div{padding:20px 22px}.sum>div+div{border-left:1px solid var(--line)}
.big{font-size:34px;font-weight:600;color:var(--ac);margin:2px 0}
.track{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0 6px}.track i{display:block;height:100%}
.lnk{border:0;background:none;color:var(--soft);text-decoration:underline;padding:0;font-size:12px}
.cb{display:grid;grid-template-columns:120px 1fr 150px;align-items:center;gap:10px;width:100%;border:0;background:none;padding:5px 6px;border-radius:6px;text-align:left}
.cb:hover,.cb.on{background:var(--bg)}.cb.on{outline:1px solid var(--ac)}
.cn{display:flex;align-items:center;gap:7px}.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bt{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bt i{display:block;height:100%}
.cv{text-align:right;font-size:13px}
.pays{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.pc{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:13px}.pc.on{border-color:var(--ac);background:var(--bg)}
.form{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;align-items:center}
.form input,.form select,.ed{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
.form input:focus,.form select:focus{border-color:var(--ac);outline:0}
#fDate{width:140px}#fName{flex:1 1 170px}#fQty{width:62px}#fPrice{width:100px;text-align:right}
.form select option,.pay option,.chip option{background:var(--sf);color:var(--ink)}
#addBtn{background:var(--ac);color:var(--sf);border:0;border-radius:6px;padding:8px 18px;font-weight:600}
.bar{display:flex;gap:10px;align-items:center;padding:12px 16px;flex-wrap:wrap}
#q{flex:1 1 180px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;color:var(--ink)}
.head,.row{display:grid;grid-template-columns:minmax(0,1fr) 128px 120px 130px 26px;gap:10px;align-items:center;padding:8px 16px}
.head{font-size:12px;color:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-top:6px;padding-bottom:6px}
.head span:nth-child(4){text-align:right}
.day{display:flex;justify-content:space-between;padding:9px 16px;background:var(--bg);font-weight:600;border-bottom:1px solid var(--line)}
.row{border-bottom:1px solid var(--line)}
.nm{cursor:text;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px}
.amt{text-align:right;cursor:text;font-weight:500}.amt small{display:block;font-weight:400}
.nm:hover,.amt:hover{background:var(--bg)}
.chip{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;font-weight:500;color:#fff;width:100%;cursor:pointer}
.pay{appearance:none;-webkit-appearance:none;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;color:var(--ink);width:100%;cursor:pointer}
.x{border:0;background:none;color:var(--bad);opacity:.35;font-size:18px;line-height:1;padding:0}.row:hover .x,.x:focus-visible{opacity:1}
.ed{width:100%;padding:2px 5px}
.empty{padding:34px 16px;text-align:center;color:var(--soft)}
.foot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;flex-wrap:wrap;gap:8px}
.foot b{font-size:20px;color:var(--ac)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--sf);padding:9px 10px 9px 16px;border-radius:999px;display:none;gap:12px;align-items:center;z-index:9}
.toast.show{display:flex}.toast button{border:0;background:var(--ac);color:var(--sf);border-radius:999px;padding:5px 12px;font-weight:600}
@media(max-width:700px){
.sum{grid-template-columns:1fr}.sum>div+div{border-left:0;border-top:1px solid var(--line)}
.cb{grid-template-columns:100px 1fr 120px}
.head{display:none}
.row{grid-template-columns:minmax(0,1fr) auto 26px;grid-template-areas:"n a x" "c p p"}
.nm{grid-area:n}.amt{grid-area:a}.x{grid-area:x}.chip{grid-area:c}.pay{grid-area:p}
.chip{width:auto;justify-self:start}.pay{width:auto;justify-self:start}
}
@media print{
[data-theme]{--bg:#fff;--sf:#fff;--ink:#000;--soft:#555;--line:#ccc;--ac:#000}
body{padding:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.noprint{display:none!important}.ptitle{display:block}.card{border:0}.x{display:none}
.cb{break-inside:avoid}.row,.day{break-inside:avoid}
}
</style>
</head>
<body data-theme="light">
<div class="wrap">
  <div class="top noprint">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg><h1>KOsT</h1><p>a running tally of what you spend</p></div>
    <div class="seg" id="seg"><button data-s="month">Month</button><button data-s="year">Year</button><button data-s="all">All time</button></div>
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <span id="mlabel"></span>
      <button id="next" aria-label="Next month">›</button>
      <button id="now">This month</button>
    </div>
    <button class="ib" id="theme" aria-label="Toggle theme">Theme</button>
  </div>
  <h2 class="ptitle" id="ptitle"></h2>

  <div class="card sum">
    <div>
      <div class="soft" id="slabel">Spent this month</div>
      <div class="big num" id="total">₹0.00</div>
      <div class="soft" id="meta"></div>
      <div id="budget"></div>
      <button class="lnk noprint" id="bbtn">Set budget</button>
    </div>
    <div>
      <div class="soft" style="margin-bottom:6px">Where it went <span class="noprint">(tap a category to filter)</span></div>
      <div id="cats"></div>
      <div class="pays" id="pays"></div>
      <div class="soft" id="mhead" style="margin:14px 0 6px"></div><div id="months"></div>
    </div>
  </div>

  <div class="card form noprint">
    <input type="date" id="fDate" aria-label="Date">
    <input id="fName" list="names" placeholder="What did you spend on?" aria-label="Item">
    <datalist id="names"></datalist>
    <input id="fQty" placeholder="Qty" title="A number multiplies the price (2). Text is only a note (2kg)" aria-label="Quantity">
    <input id="fPrice" class="num" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Amount" aria-label="Amount">
    <select id="fCat" aria-label="Category"></select>
    <select id="fPay" aria-label="Paid via"></select>
    <button id="addBtn">Add</button>
  </div>

  <div class="card">
    <div class="bar noprint">
      <input id="q" type="search" placeholder="Search by item, category or payment method">
      <button class="lnk" id="clear" style="display:none">Clear filters</button>
    </div>
    <div class="head"><span>What</span><span>Category</span><span>Paid via</span><span>Amount</span><span></span></div>
    <div id="list"></div>
    <div class="foot"><span class="soft" id="showing"></span><span>Total shown <b class="num" id="shown">₹0.00</b></span></div>
    <div class="acts noprint">
      <button class="ib" id="csv">Export CSV</button>
      <button class="ib" id="pdf">Print / PDF</button>
      <button class="ib" id="bak">Backup</button>
      <button class="ib" id="res">Restore</button>
      <button class="lnk" id="wipe" style="margin-left:auto">Clear all</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="undo">Undo</button></div>

<script>
(function(){
var K="kost-items-v1",TK="kost-theme-v1",BK="kost-budget-v1";
var CATS={Food:"#D9782A",Transport:"#2F7FB8",Bills:"#7B55BA",Shopping:"#C2487C",Health:"#2E9A6E",Rent:"#A47A2C",Other:"#7E7E75",Uncategorised:"#9A9686"};
var PAYS=["Cash","UPI","Card","Net banking"];
var items=[],nextId=1,theme="light",budget=0,scope="month",fCat="",fPay="",q="",last=null,tt=null;
var $=function(i){return document.getElementById(i)};
var pad=function(n){return String(n).padStart(2,"0")};
var key=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var today=function(){return key(new Date())};
var view=today().slice(0,7);
var pd=function(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
var fmt=function(n){return "₹"+n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var mult=function(x){var t=String(x||"").trim();return /^\d+(\.\d+)?$/.test(t)&&+t>0?+t:null};
var lt=function(i){return (mult(i.qty)||1)*i.price};
var sum=function(l){return l.reduce(function(s,i){return s+lt(i)},0)};
var cat=function(i){return i.cat||"Uncategorised"};
var pay=function(i){return i.pay||"—"};
var plabel=function(p){return p==="—"?"Not set":p};

function save(){try{localStorage.setItem(K,JSON.stringify({items:items,nextId:nextId}))}catch(e){}}
function load(){try{
  var r=localStorage.getItem(K);
  if(r){var p=JSON.parse(r);if(p&&Array.isArray(p.items)){items=p.items;nextId=p.nextId||items.reduce(function(m,i){return Math.max(m,i.id)},0)+1}}
  var t=localStorage.getItem(TK);
  if(t==="dark"||t==="light")theme=t;else if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)theme="dark";
  budget=+localStorage.getItem(BK)||0;
}catch(e){}
items.forEach(function(i){i.date=i.date||today()});}

function opts(list,cur,lab){
  if(list.indexOf(cur)<0)list=[cur].concat(list);
  return list.map(function(v){return '<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(lab?lab(v):v)+'</option>'}).join("");
}
var CATLIST=Object.keys(CATS).filter(function(k){return k!=="Uncategorised"});
var PAYLIST=["—"].concat(PAYS);

function render(){
  var d0=pd(view+"-01"),yr=view.slice(0,4);
  var label=scope==="month"?d0.toLocaleDateString("en-IN",{month:"long",year:"numeric"}):scope==="year"?yr:"All time";
  $("mlabel").textContent=label;$("ptitle").textContent="Expenses — "+label;
  var pre=scope==="month"?view:scope==="year"?yr:"";
  var mi=items.filter(function(i){return i.date.indexOf(pre)===0}),tot=sum(mi);
  var t0=today(),r0=scope==="month"?view+"-01":scope==="year"?yr+"-01-01":mi.reduce(function(m,i){return i.date<m?i.date:m},t0);
  var r1=scope==="month"?key(new Date(d0.getFullYear(),d0.getMonth()+1,0)):scope==="year"?yr+"-12-31":mi.reduce(function(m,i){return i.date>m?i.date:m},t0);
  if(r1>t0&&r0<=t0)r1=t0;
  var days=Math.max(1,Math.round((pd(r1)-pd(r0))/864e5)+1);
  $("total").textContent=fmt(tot);
  $("meta").textContent=mi.length?mi.length+" expense"+(mi.length>1?"s":"")+" · about "+fmt(tot/days)+" a day":"Nothing recorded this month";
  $("bbtn").style.display=scope==="month"?"":"none";$("bbtn").textContent=budget>0?"Edit budget":"Set a monthly budget";
  $("budget").innerHTML=scope==="month"&&budget>0?'<div class="track"><i style="width:'+Math.min(100,tot/budget*100)+'%;background:'+(tot/budget>=.9?"var(--bad)":"var(--ac)")+'"></i></div><span class="soft">'+(tot>budget?fmt(tot-budget)+" over the "+fmt(budget)+" budget":fmt(budget-tot)+" left of "+fmt(budget))+'</span>':"";

  var bc={},bp={};
  mi.forEach(function(i){bc[cat(i)]=(bc[cat(i)]||0)+lt(i);bp[pay(i)]=(bp[pay(i)]||0)+lt(i)});
  var srt=function(o){return Object.keys(o).sort(function(a,b){return o[b]-o[a]})};
  $("cats").innerHTML=srt(bc).map(function(c){var v=bc[c],col=CATS[c]||CATS.Other,pc=tot?v/tot*100:0;
    return '<button class="cb'+(fCat===c?" on":"")+'" data-cat="'+esc(c)+'"><span class="cn"><i class="dot" style="background:'+col+'"></i>'+esc(c)+'</span><span class="bt"><i style="width:'+pc+'%;background:'+col+'"></i></span><span class="num cv">'+fmt(v)+' <small>'+Math.round(pc)+'%</small></span></button>'}).join("")||'<p class="soft">Add an expense to see where your money goes.</p>';
  $("pays").innerHTML=srt(bp).map(function(p){return '<button class="pc'+(fPay===p?" on":"")+'" data-pay="'+esc(p)+'">'+esc(plabel(p))+' <b class="num">'+fmt(bp[p])+'</b></button>'}).join("");

  $("slabel").textContent=scope==="month"?"Spent this month":scope==="year"?"Spent in "+yr:"Spent in total";
  var bm={};mi.forEach(function(i){var m=i.date.slice(0,7);bm[m]=(bm[m]||0)+lt(i)});
  var mk=Object.keys(bm).sort(),mx=Math.max.apply(null,mk.map(function(m){return bm[m]}).concat(1));
  $("mhead").innerHTML=scope==="month"?"":'By month <span class="noprint">(tap a month to open it)</span>';
  $("months").innerHTML=scope==="month"?"":mk.map(function(m){return '<button class="cb" data-month="'+m+'"><span class="cn">'+pd(m+"-01").toLocaleDateString("en-IN",{month:"short",year:"numeric"})+'</span><span class="bt"><i style="width:'+bm[m]/mx*100+'%;background:var(--ac)"></i></span><span class="num cv">'+fmt(bm[m])+' <small>'+Math.round(tot?bm[m]/tot*100:0)+'%</small></span></button>'}).join("");
  Array.prototype.forEach.call($("seg").children,function(x){x.classList.toggle("on",x.dataset.s===scope)});
  $("prev").style.display=$("next").style.display=scope==="all"?"none":"";
  var sh=mi.filter(function(i){return (!fCat||cat(i)===fCat)&&(!fPay||pay(i)===fPay)&&(!q||(i.name+" "+cat(i)+" "+plabel(pay(i))).toLowerCase().indexOf(q)>-1)});
  var g={};sh.forEach(function(i){(g[i.date]=g[i.date]||[]).push(i)});
  $("list").innerHTML=Object.keys(g).sort().reverse().map(function(d){
    var l=g[d],t=d===today()?" · Today":"";
    return '<div class="day"><span>'+pd(d).toLocaleDateString("en-IN",scope==="month"?{weekday:"short",day:"numeric",month:"short"}:{weekday:"short",day:"numeric",month:"short",year:"numeric"})+t+'</span><span class="num">'+fmt(sum(l))+'</span></div>'+
    l.map(function(i){var m=mult(i.qty),c=cat(i);
      return '<div class="row" data-id="'+i.id+'"><span class="nm" data-f="name" tabindex="0" title="Click to edit">'+esc(i.name)+(i.qty&&!m?' <small>'+esc(i.qty)+'</small>':'')+'</span>'+
      '<select class="chip" data-f="cat" aria-label="Category" style="background:'+(CATS[c]||CATS.Other)+'">'+opts(CATLIST,c)+'</select>'+
      '<select class="pay" data-f="pay" aria-label="Paid via">'+opts(PAYLIST,pay(i),plabel)+'</select>'+
      '<span class="num amt" data-f="price" tabindex="0" title="Click to edit unit price">'+fmt(lt(i))+(m?'<small>'+m+' × '+fmt(i.price)+'</small>':'')+'</span>'+
      '<button class="x" data-del="'+i.id+'" aria-label="Remove '+esc(i.name)+'">×</button></div>'}).join("");
  }).join("")||'<div class="empty">'+(mi.length?"No expenses match these filters.":"No expenses "+(scope==="all"?"yet":"in "+label+" yet")+". Add one above.")+'</div>';
  var f=fCat||fPay||q;
  $("clear").style.display=f?"":"none";
  $("showing").textContent=f?"Showing "+sh.length+" of "+mi.length+(scope==="month"?" this month":scope==="year"?" in "+yr:" overall"):sh.length+" expense"+(sh.length===1?"":"s");
  $("shown").textContent=fmt(sum(sh));
  var seen={};$("names").innerHTML=items.map(function(i){var n=i.name,k=n.toLowerCase();if(seen[k])return"";seen[k]=1;return '<option value="'+esc(n)+'">'}).join("");
  ["csv","pdf","bak"].forEach(function(b){$(b).disabled=!items.length});
}

function shift(n){var d=pd(view+"-01");if(scope==="year")d.setFullYear(d.getFullYear()+n);else d.setMonth(d.getMonth()+n);view=key(d).slice(0,7);fCat=fPay="";render()}
$("prev").onclick=function(){shift(-1)};$("next").onclick=function(){shift(1)};
$("now").onclick=function(){scope="month";view=today().slice(0,7);fCat=fPay="";render()};
$("seg").onclick=function(e){var b=e.target.closest("[data-s]");if(!b)return;scope=b.dataset.s;fCat=fPay="";render()};
$("months").onclick=function(e){var b=e.target.closest("[data-month]");if(!b)return;view=b.dataset.month;scope="month";fCat=fPay="";render()};
$("cats").onclick=function(e){var b=e.target.closest("[data-cat]");if(!b)return;fCat=fCat===b.dataset.cat?"":b.dataset.cat;render()};
$("pays").onclick=function(e){var b=e.target.closest("[data-pay]");if(!b)return;fPay=fPay===b.dataset.pay?"":b.dataset.pay;render()};
$("q").oninput=function(){q=this.value.trim().toLowerCase();render()};
$("clear").onclick=function(){fCat=fPay=q="";$("q").value="";render()};
$("bbtn").onclick=function(){var v=prompt("Monthly budget in ₹ (enter 0 to remove)",budget||"");if(v===null)return;budget=Math.max(0,parseFloat(v)||0);try{localStorage.setItem(BK,budget)}catch(e){}render()};

// add form
$("fCat").innerHTML=opts(CATLIST,"Food");$("fPay").innerHTML=opts(PAYS,"UPI");$("fDate").value=today();
$("fName").onchange=function(){
  var n=this.value.trim().toLowerCase(),m=null;
  for(var i=items.length-1;i>=0;i--)if(items[i].name.toLowerCase()===n){m=items[i];break}
  if(!m)return;
  if(m.cat)$("fCat").value=m.cat;if(m.pay&&m.pay!=="—")$("fPay").value=m.pay;if(!$("fPrice").value)$("fPrice").value=m.price;
};
function add(){
  var name=$("fName").value.trim(),price=parseFloat($("fPrice").value),date=$("fDate").value||today();
  if(!name||isNaN(price)||price<0){(!name?$("fName"):$("fPrice")).focus();return}
  items.push({id:nextId++,name:name,price:price,qty:$("fQty").value.trim(),date:date,cat:$("fCat").value,pay:$("fPay").value});
  view=date.slice(0,7);fCat=fPay=q="";$("q").value="";
  $("fName").value=$("fQty").value=$("fPrice").value="";$("fName").focus();
  save();render();
}
$("addBtn").onclick=add;
["fName","fQty","fPrice"].forEach(function(i){$(i).onkeydown=function(e){if(e.key==="Enter")add()}});

// list: edit / delete
function get(el){var r=el.closest(".row");return items.filter(function(i){return i.id==r.dataset.id})[0]}
function edit(s){
  var it=get(s),f=s.dataset.f,inp=document.createElement("input"),done=false;
  inp.className="ed"+(f==="price"?" num":"");inp.type=f==="price"?"number":"text";inp.step="0.01";inp.value=f==="price"?it.price:it.name;
  s.textContent="";s.appendChild(inp);inp.focus();inp.select();
  function fin(){if(done)return;done=true;
    if(f==="price"){var p=parseFloat(inp.value);if(p>=0)it.price=p}else if(inp.value.trim())it.name=inp.value.trim();
    save();render()}
  inp.onblur=fin;
  inp.onkeydown=function(e){if(e.key==="Enter")inp.blur();if(e.key==="Escape"){done=true;render()}};
}
$("list").onclick=function(e){
  var d=e.target.closest("[data-del]");
  if(d){var id=+d.dataset.del,ix=items.findIndex(function(i){return i.id===id});last={item:items[ix],ix:ix};items.splice(ix,1);save();render();
    $("tmsg").textContent='"'+last.item.name.slice(0,24)+'" removed';$("toast").classList.add("show");clearTimeout(tt);tt=setTimeout(function(){$("toast").classList.remove("show");last=null},8000);return}
  var s=e.target.closest("span[data-f]");if(s&&!s.querySelector("input"))edit(s);
};
$("list").onkeydown=function(e){var s=e.target;if(e.key==="Enter"&&s.matches&&s.matches("span[data-f]")&&!s.querySelector("input")){e.preventDefault();edit(s)}};
$("list").onchange=function(e){var s=e.target;if(s.tagName!=="SELECT")return;get(s)[s.dataset.f]=s.value;save();render()};
$("undo").onclick=function(){if(!last)return;items.splice(Math.min(last.ix,items.length),0,last.item);last=null;$("toast").classList.remove("show");save();render()};

// export / backup
function dl(text,type,name){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href)},500)}
$("csv").onclick=function(){
  var rows=[["Date","Item","Qty","Unit price","Category","Paid via","Line total"]];
  items.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).forEach(function(i){rows.push([i.date,i.name,i.qty||"",i.price.toFixed(2),cat(i),plabel(pay(i)),lt(i).toFixed(2)])});
  rows.push([],["","","","","","Total",sum(items).toFixed(2)]);
  dl(rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(",")}).join("\n"),"text/csv;charset=utf-8","kost-"+today()+".csv");
};
$("pdf").onclick=function(){window.print()};
$("bak").onclick=function(){dl(JSON.stringify({items:items,nextId:nextId,exportedAt:new Date().toISOString()},null,2),"application/json","kost-backup-"+today()+".json")};
$("res").onclick=function(){$("file").click()};
$("file").onchange=function(){
  var f=this.files[0];this.value="";if(!f)return;var r=new FileReader();
  r.onload=function(){try{var p=JSON.parse(r.result);if(!p||!Array.isArray(p.items))throw 0;
    if(items.length&&!confirm("Restore will replace your "+items.length+" current expense(s). Continue?"))return;
    items=p.items;nextId=p.nextId||items.reduce(function(m,i){return Math.max(m,i.id)},0)+1;items.forEach(function(i){i.date=i.date||today()});save();render()}
    catch(e){alert("That doesn't look like a KOsT backup file.")}};
  r.readAsText(f);
};
$("wipe").onclick=function(){if(items.length&&!confirm("Delete all expenses? This can't be undone."))return;items=[];save();render()};
$("theme").onclick=function(){theme=theme==="light"?"dark":"light";document.body.setAttribute("data-theme",theme);try{localStorage.setItem(TK,theme)}catch(e){}};

load();document.body.setAttribute("data-theme",theme);render();
})();
</script>
</body>
